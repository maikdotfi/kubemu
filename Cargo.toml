[workspace]
resolver = "3"
members = ["crates/*", "testing/sim", "testing/oracle-fuzz", "testing/bench"]
default-members = ["crates/*", "testing/sim", "testing/oracle-fuzz", "testing/bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/maikdotfi/kubemu"
publish = false
# License: undecided, see docs/adr/0009-license-and-naming.md

[workspace.dependencies]
# Add internal crates here as they gain a dependent.
kubemu-api = { path = "crates/kubemu-api" }
kubemu-api-types = { path = "crates/kubemu-api-types" }
kubemu-controllers = { path = "crates/kubemu-controllers" }
kubemu-env = { path = "crates/kubemu-env" }
kubemu-env-sim = { path = "crates/kubemu-env-sim" }
kubemu-env-real = { path = "crates/kubemu-env-real" }
kubemu-apiserver = { path = "crates/kubemu-apiserver" }
kubemu-faults = { path = "crates/kubemu-faults" }
kubemu-patch = { path = "crates/kubemu-patch" }
kubemu-proto = { path = "crates/kubemu-proto" }
kubemu-scheduler = { path = "crates/kubemu-scheduler" }
kubemu-store = { path = "crates/kubemu-store" }
kubemu-validation = { path = "crates/kubemu-validation" }

# External. Pinned in Cargo.lock; add here only when code uses them.
imbl = "7.0.2"
# resource.Quantity values (kubemu-validation): arbitrary precision, as inf.Dec.
num-bigint = { version = "0.4.6", default-features = false, features = ["std"] }
num-integer = { version = "0.1.46", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
serde_json = "1.0.154"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Shell crates only (ADR 0001): never in a core crate, checked by scripts/check-core-deps.sh.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3.34", default-features = false }


[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Determinism boundary: see clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
