name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    # Hosted runner for now; namespace/root-heavy jobs move to self-hosted
    # sandboxed runners later (README §11, ADR 0008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (incl. determinism lints)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: core crates stay runtime-free (ADR 0001)
        run: scripts/check-core-deps.sh
      - name: test
        run: cargo test --workspace
      - name: DST sweep + determinism check
        run: cargo run --release -p kubemu-sim -- --seeds 1000 --check-determinism

  oracle-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: go
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: k8s pins agree (ADR 0007)
        run: scripts/check-k8s-pins.sh
      - name: go vet + test
        working-directory: testing/oracle-go
        run: go vet ./... && go test ./...
      - name: differential fuzz vs Go oracle
        run: mise run fuzz -- --cases 10000
      - name: protobuf OpenAPI v2 matches Go's conversion (ADR 0014)
        run: mise run openapi-v2-pb-check

  kubectl-smoke:
    # M1 exit criterion: kubectl get/apply/delete/watch against `kubemu up`,
    # plus protobuf-sending typed clients: kubectl create, helm (ADR 0014).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: kubectl helm
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: kubectl and helm smoke test
        run: scripts/kubectl-smoke.sh

  informer:
    # M1 exit criterion: client-go informers (default settings) converge
    # through list, watch, relist after 410 and bookmarks, under faults.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: go
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: go vet
        working-directory: testing/informer-go
        run: go vet ./...
      - name: informer harness
        run: mise run informer

  bench:
    # Resource and latency budgets (README §4.4, testing/bench).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: budgets
        run: |
          cargo build -q --release -p kubemu-cli -p kubemu-bench
          target/release/kubemu-bench --kubemu target/release/kubemu
