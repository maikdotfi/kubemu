name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    # Hosted runner for now; namespace/root-heavy jobs move to self-hosted
    # sandboxed runners later (README §11, ADR 0008).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (incl. determinism lints)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: core crates stay runtime-free (ADR 0001)
        run: scripts/check-core-deps.sh
      - name: test
        run: cargo test --workspace
      - name: DST sweep + determinism check
        run: cargo run --release -p kubemu-sim -- --seeds 1000 --check-determinism

  oracle-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: go
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: k8s pins agree (ADR 0007)
        run: scripts/check-k8s-pins.sh
      - name: go vet + test
        working-directory: testing/oracle-go
        run: go vet ./... && go test ./...
      - name: differential fuzz vs Go oracle
        run: mise run fuzz -- --cases 10000

  kubectl-smoke:
    # M1 exit criterion: kubectl get/apply/delete/watch against `kubemu up`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: kubectl
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: kubectl smoke test
        run: scripts/kubectl-smoke.sh
